<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Portafolio de Programación 💜</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- 1. Estilos de colores para el código (Tema One Dark de Prism) -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-okaidia.min.css" rel="stylesheet" />
</head>
<body>

  <!-- Encabezado -->
  <header class="header">
    <div class="user-profile">
      <div class="avatar">✨</div>
      <div>
        <h1>Mi Portafolio de Proyectos</h1>
        <p>Estudiante de Desarrollo Web. Carpeta de Actividades</p>
      </div>
    </div>
  </header>

  <!-- Buscador -->
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Buscar actividad por nombre o tecnología..." onkeyup="filtrarActividades()">
  </div>

  <!-- Contenedor de Tarjetas -->
  <main class="grid-container" id="cardsContainer">
  </main>

  <!-- Ventana Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Título del Proyecto</h3>
        
        <div class="modal-header-right">
          <div class="modal-tabs">
            <button class="tab-btn active" id="tabPreviewBtn" onclick="cambiarPestana('preview')">Vista Previa 👁️</button>
            <button class="tab-btn" id="tabCodeBtn" onclick="cambiarPestana('code')">Código 💻</button>
          </div>
          <button class="close-btn" onclick="cerrarModal()">&times;</button>
        </div>
      </div>

      <div class="modal-body">
        <!-- Panel de Vista Previa -->
        <div class="modal-pane active" id="panePreview">
          <iframe id="projectIframe" src="" title="Vista previa del ejercicio"></iframe>
        </div>

        <!-- Panel de Código Fuente (Con las clases language-html requeridas por Prism) -->
        <div class="modal-pane" id="paneCode">
          <pre class="code-container"><code id="codeContent" class="language-html">El código aparecerá aquí...</code></pre>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <!-- 2. Script de Prism.js para colorear el código automáticamente -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
</body>
</html>
